name: Release

# Runs when a GitHub release is published (for example v0.2.0):
#   1. builds the wheel and sdist, checks the version matches the tag, attaches them to the release
#   2. builds the container image and pushes it to GitHub Packages (ghcr.io)
# Only the built-in GITHUB_TOKEN is used, no extra secrets.

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version in pyproject.toml must match the release tag
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "pyproject version: $VERSION, tag: $GITHUB_REF_NAME"
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          datasniff --help
      - name: Attach wheel and sdist to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  container:
    runs-on: ubuntu-latest
    needs: python-package
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/datasniff
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
