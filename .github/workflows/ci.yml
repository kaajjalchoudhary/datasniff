name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -v
      - name: CLI smoke test
        shell: bash
        run: |
          datasniff examples/orders.csv
          datasniff dbt examples/orders.csv --model stg_orders
          datasniff ddl examples/orders.csv --dialect bigquery --table raw.orders
          datasniff check examples/orders.csv --not-null order_id --min-rows 10
          if datasniff check examples/orders.csv --no-duplicates; then
            echo "expected the duplicate-row check to fail"; exit 1
          fi

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run this repo's GitHub Action
        uses: ./
        with:
          path: examples/orders.csv
          args: --not-null order_id --require-column amount --min-rows 10
